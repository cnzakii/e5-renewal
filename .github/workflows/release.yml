name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate tag and draft state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release-guard.sh "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: goreleaser check
      - name: Build and verify release archives
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          make dist VERSION="$BUILD_VERSION"
          set -- dist/e5-renewal-*.tar.gz
          test "$#" -eq 4
          host="$(go env GOOS)-$(go env GOARCH)"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            archive="dist/e5-renewal-$target.tar.gz"
            test "$(tar -tzf "$archive" | LC_ALL=C sort)" = "$(printf 'LICENSE\nREADME.md\ne5-renewal')"
            directory="$(mktemp -d)"
            tar -xzf "$archive" -C "$directory"
            test -x "$directory/e5-renewal"
            if [[ "$target" == "$host" ]]; then
              test "$("$directory/e5-renewal" --version)" = "$BUILD_VERSION"
            fi
          done
          cd dist
          sha256sum -c checksums.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
      - name: Load native release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: e5-renewal:release
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=container
      - run: scripts/container-smoke.sh e5-renewal:release
      - run: scripts/container-smoke.sh e5-renewal:release /tools/e5
      - name: Confirm draft before image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release-guard.sh "$RELEASE_TAG"
      - name: Publish container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          state="$(bash .github/scripts/release-guard.sh "$RELEASE_TAG")"
          if [[ "$state" == missing ]]; then
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes "${options[@]}"
          fi
          bash .github/scripts/release-guard.sh "$RELEASE_TAG"
          cd dist
          gh release upload "$RELEASE_TAG" e5-renewal-*.tar.gz checksums.txt --clobber

  promote:
    name: Promote published stable image
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote GitHub's current stable release by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/latest"
          tag="$(gh api "$endpoint" --jq '.tag_name')"
          number='(0|[1-9][0-9]*)'
          pattern="^v$number\.$number\.$number$"
          if [[ ! "$tag" =~ $pattern ]]; then
            echo "Invalid stable release tag: $tag" >&2
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          digest="$(docker buildx imagetools inspect "$image:${tag#v}" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          current_tag="$(gh api "$endpoint" --jq '.tag_name')"
          if [[ "$tag" != "$current_tag" ]]; then
            echo "Latest release changed; its publication will handle promotion."
            exit 0
          fi
          docker buildx imagetools create --tag "$image:latest" "$image@$digest"
