name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e5test
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: e5test
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U e5test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root-only
          MYSQL_USER: e5test
          MYSQL_PASSWORD: integration-test-only
          MYSQL_DATABASE: e5test
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping --silent --host=127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E5_TEST_POSTGRES_DSN: "host=127.0.0.1 port=15432 user=e5test password=integration-test-only dbname=e5test sslmode=disable"
      E5_TEST_MYSQL_DSN: "e5test:integration-test-only@tcp(127.0.0.1:13306)/e5test?charset=utf8mb4&parseTime=true&loc=UTC"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - run: cd frontend && bun install --frozen-lockfile
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-only: true
      - run: make check
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python3 -B -m unittest discover -s .github/scripts -p '*_test.py'

  macos:
    name: Native macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - name: Build and check native executable
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          make build VERSION="$BUILD_VERSION"
          test "$(./bin/e5-renewal --version)" = "$BUILD_VERSION"
      - run: make test

  package:
    name: Package and smoke test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: goreleaser check
      - name: Build and verify native archives
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          make dist VERSION="$BUILD_VERSION"
          set -- dist/e5-renewal-*.tar.gz
          test "$#" -eq 4
          host="$(go env GOOS)-$(go env GOARCH)"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            archive="dist/e5-renewal-$target.tar.gz"
            test "$(tar -tzf "$archive" | LC_ALL=C sort)" = "$(printf 'LICENSE\nREADME.md\ne5-renewal')"
            directory="$(mktemp -d)"
            tar -xzf "$archive" -C "$directory"
            test -x "$directory/e5-renewal"
            if [[ "$target" == "$host" ]]; then
              test "$("$directory/e5-renewal" --version)" = "$BUILD_VERSION"
            fi
          done
          cd dist
          sha256sum -c checksums.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max
      - name: Load native container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: e5-renewal:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=container
      - run: scripts/container-smoke.sh e5-renewal:ci
      - run: scripts/container-smoke.sh e5-renewal:ci /tools/e5
