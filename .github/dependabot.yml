version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: bun
    directory: "/frontend"
    schedule:
      interval: monthly
    ignore:
      # Remove when typescript-eslint supports the TypeScript 7 compiler API.
      - dependency-name: typescript
        versions: ["7.x"]
      # These releases fail EventTarget checks during Bun/Vitest startup.
      - dependency-name: jsdom
        versions: [">=30.1.0 <30.1.4"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
